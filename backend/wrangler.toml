name = "ohr-backend"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[durable_objects]
bindings = [
  { name = "SESSION_DO", class_name = "SessionDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[vars]
# CORS: code also allows localhost + https://*.github.io. This is the primary prod origin.
ALLOWED_ORIGIN = "https://llcaptainmorgan.github.io"
# /race bot: Pages join URL + guild allowlist (BlurpBlurps, Head Pat, The Fireteam)
FRONTEND_PLAY_URL = "https://llcaptainmorgan.github.io/OverwatchHorseRacing/main/"
ALLOWED_GUILD_IDS = "1540521473004019742,1231421702186078258,878867762993324083"
